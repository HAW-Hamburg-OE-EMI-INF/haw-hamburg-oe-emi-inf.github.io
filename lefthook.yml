pre-commit:
  commands:
    fmt:check:
      glob: "*.{js,ts,jsx,tsx,mjs,cjs,mts,cts,astro,json,jsonc,css,md,mdx,html,yaml,yml}"
      run: npm run fmt:check {staged_files}
    lint:
      glob: "*.{js,ts,jsx,tsx,mjs,cjs,mts,cts,astro}"
      run: npm run lint {staged_files}
    typecheck:
      glob: "*.{ts,tsx,js,jsx,astro}"
      run: npm run typecheck

pre-push:
  commands:
    fmt:check:
      run: npm run fmt:check
    lint:
      run: npm run lint
    typecheck:
      run: npm run typecheck
    build:
      run: npm run build
